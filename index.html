const daysBetween = (d1, d2) => {
    const a = new Date(d1); const b = new Date(d2);
    a.setHours(0,0,0,0); b.setHours(0,0,0,0);
    return Math.round((b - a) / 86400000);
};

const today = () => {
    const d = new Date();
    return d.toISOString().split('T')[0];
};

const addMonths = (dateStr, months) => {
    const d = new Date(dateStr);
    d.setMonth(d.getMonth() + months);
    return d.toISOString().split('T')[0];
};

const formatNumber = (n, decimals = 2) => {
    if (n == null || isNaN(n)) return '—';
    return n.toLocaleString('fr-FR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
};

const formatRate = (n, pair) => {
    if (n == null || isNaN(n)) return '—';
    const dec = (pair && (pair.includes('HUF') || pair.includes('CZK'))) ? 2 : 4;
    return n.toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};

// ════════════════════════════════════════════
// FORWARD POINTS CALCULATION (IRP)
// ════════════════════════════════════════════
const calcForwardPoints = (spot, rateBase, rateQuote, days) => {
    // Interest Rate Parity: F = S × (1 + rQ × d/360) / (1 + rB × d/360)
    // Forward Points = F - S = S × [(rQ - rB) × d/360] / [1 + rB × d/360]
    const rb = rateBase / 100;
    const rq = rateQuote / 100;
    const d = days / 360;
    const points = spot * (rq - rb) * d / (1 + rb * d);
    return points;
};

const calcFeePoints = (spot, feePercent) => {
    return spot * (feePercent / 100);
};

const calcForwardRate = (spot, rateBase, rateQuote, days, feePercent, direction) => {
    const fwdPts = calcForwardPoints(spot, rateBase, rateQuote, days);
    const feePts = calcFeePoints(spot, feePercent);
    // Fee always makes the rate worse for the client
    // Buy quote currency: client pays more → add fee
    // Sell quote currency: client receives less → subtract fee
    const feeAdj = direction === 'buy' ? feePts : -feePts;
    return {
        forwardPoints: fwdPts,
        feePoints: feePts,
        forwardRate: spot + fwdPts + feeAdj,
        totalPoints: fwdPts + feeAdj
    };
};

// ════════════════════════════════════════════
// MARGIN CALL CALCULATIONS
// ════════════════════════════════════════════
const calcMarginCall = (notional, fwdRate, spot, direction, marginPct, triggerPct) => {
    const contractValue = notional * fwdRate;
    const initialDeposit = contractValue * (marginPct / 100);
    const marginCallAmt = initialDeposit * (triggerPct / 100);
    
    // How much can spot move before margin call?
    // Loss = notional × |spot_new - fwd_rate|
    // Margin call when loss >= initialDeposit × (1 - triggerPct/100)
    const buffer = initialDeposit * (1 - triggerPct / 100);
    const movePerUnit = buffer / notional;
    
    // If buying quote (selling base): loss when spot goes DOWN from fwd_rate
    // If selling quote (buying base): loss when spot goes UP from fwd_rate
    let mc1Spot, mc2Spot, mc3Spot;
    if (direction === 'buy') {
        // Client bought at fwdRate. Loses if market spot drops (could have bought cheaper)
        mc1Spot = fwdRate - movePerUnit;
        mc2Spot = fwdRate - movePerUnit * 2;
        mc3Spot = fwdRate - movePerUnit * 3;
    } else {
        // Client sold at fwdRate. Loses if market spot rises (could have sold higher)
        mc1Spot = fwdRate + movePerUnit;
        mc2Spot = fwdRate + movePerUnit * 2;
        mc3Spot = fwdRate + movePerUnit * 3;
    }

    const distanceToMC1 = Math.abs(spot - mc1Spot);
    const distanceToMC1Pips = distanceToMC1 * 10000;
    
    let riskLevel = 'low';
    const pctDistance = (distanceToMC1 / spot) * 100;
    if (pctDistance < 1) riskLevel = 'critical';
    else if (pctDistance < 3) riskLevel = 'high';
    else if (pctDistance < 5) riskLevel = 'medium';

    return {
        contractValue,
        initialDeposit,
        marginCallAmt,
        mc1Spot,
        mc2Spot,
        mc3Spot,
        distanceToMC1,
        distanceToMC1Pips,
        riskLevel
    };
};

// TOAST COMPONENT
// ════════════════════════════════════════════
const Toast = ({ message, onClose }) => {
    const [exiting, setExiting] = useState(false);
    useEffect(() => {
        const t1 = setTimeout(() => setExiting(true), 2500);
        const t2 = setTimeout(onClose, 2800);
        return () => { clearTimeout(t1); clearTimeout(t2); };
    }, [onClose]);
    return (
        <div className={`fixed top-5 right-5 z-50 ${exiting ? 'toast-exit' : 'toast-enter'}`}>
            <div className="flex items-center gap-3 px-5 py-3 bg-emerald-600 text-white rounded-xl shadow-2xl">
                <Icon name="shield" className="w-5 h-5 text-emerald-200" />
                <span className="font-medium text-sm">{message}</span>
            </div>
        </div>
    );
};

                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100">{title}</h3>
                    <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        <Icon name="x" className="w-5 h-5 text-slate-400" />
                    </button>
                </div>
                {children}
            </div>
        </div>
    );
};

// ════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════
const App = () => {
    // Theme & Language
    const [dark, setDark] = useState(() => localStorage.getItem('fx-theme') === 'dark');
    const [lang, setLang] = useState(() => localStorage.getItem('fx-lang') || 'fr');
    const t = T[lang];

    useEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
        localStorage.setItem('fx-theme', dark ? 'dark' : 'light');
    }, [dark]);
    useEffect(() => { localStorage.setItem('fx-lang', lang); }, [lang]);

    // Toast
    const [toast, setToast] = useState(null);
    const showToast = useCallback((msg) => setToast(msg), []);

    // Interest rates
    const [rates, setRates] = useState(() => {
        const saved = localStorage.getItem('fx-rates');
        return saved ? JSON.parse(saved) : { ...DEFAULT_RATES };
    });
    useEffect(() => { localStorage.setItem('fx-rates', JSON.stringify(rates)); }, [rates]);

    const [showRates, setShowRates] = useState(false);

    // Strategy state
    const [baseCcy, setBaseCcy] = useState('EUR');
    const [quoteCcy, setQuoteCcy] = useState('USD');
    const [spot, setSpot] = useState(1.0850);
    const [isLive, setIsLive] = useState(true);
    const baseSpotRef = useRef(1.0850);
    const [feePercent, setFeePercent] = useState(0.15);
    const [marginPct, setMarginPct] = useState(5);
    const [marginTrigger, setMarginTrigger] = useState(5);

    const todayStr = today();
    const createDefaultTranche = (index = 0) => ({
        id: Date.now() + Math.random(),
        startDate: addMonths(todayStr, 1 + index),
        endDate: addMonths(todayStr, 2 + index),
        direction: 'buy',
        notional: 100000,
    });

    const [tranches, setTranches] = useState([createDefaultTranche(0)]);

    // Live Spot Fetching
    useEffect(() => {
        let fetchInterval, tickInterval;
        
        const fetchBaseRate = async () => {
            if (!isLive) return;
            if (baseCcy === quoteCcy) {
                setSpot(1);
                baseSpotRef.current = 1;
                return;
            }
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${baseCcy}`);
                const data = await res.json();
                if (data && data.rates && data.rates[quoteCcy]) {
                    baseSpotRef.current = data.rates[quoteCcy];
                    setSpot(baseSpotRef.current);
                }
            } catch (e) {
                console.error("Failed to fetch live rate", e);
            }
        };

        if (isLive) {
            fetchBaseRate();
            // Fetch real rate every 60 seconds to avoid API limits
            fetchInterval = setInterval(fetchBaseRate, 60000);
            
            // Simulate interbank live tick every 1.5 seconds (micro-volatility)
            tickInterval = setInterval(() => {
                const dec = (quoteCcy === 'HUF' || quoteCcy === 'CZK') ? 100 : 10000;
                // random movement between -2 and +2 pips
                const movement = (Math.random() * 4 - 2) / dec;
                setSpot(prev => {
                    // prevent drifting too far from the real base rate
                    const newSpot = prev + movement;
                    const maxDrift = 10 / dec; 
                    if (Math.abs(newSpot - baseSpotRef.current) > maxDrift) {
                        return baseSpotRef.current + (Math.sign(movement) * maxDrift);
                    }
                    return parseFloat(newSpot.toFixed(dec === 100 ? 3 : 5));
                });
            }, 1500);
        }

        return () => {
            clearInterval(fetchInterval);
            clearInterval(tickInterval);
        };
    }, [isLive, baseCcy, quoteCcy]);

    // Save modal
    const [saveModalOpen, setSaveModalOpen] = useState(false);
    const [saveName, setSaveName] = useState('');

    // Saved strategies panel
    const [showSaved, setShowSaved] = useState(false);
    const [savedStrategies, setSavedStrategies] = useState(() => {
        const s = localStorage.getItem('fx-strategies');
        return s ? JSON.parse(s) : [];
    });
    useEffect(() => { localStorage.setItem('fx-strategies', JSON.stringify(savedStrategies)); }, [savedStrategies]);

    // Computed tranches with forward calculations
    const computedTranches = useMemo(() => {
        return tranches.map(tr => {
            const daysToEnd = daysBetween(todayStr, tr.endDate);
            const d = Math.max(daysToEnd, 1);
            const rBase = rates[baseCcy] || 0;
            const rQuote = rates[quoteCcy] || 0;
            const calc = calcForwardRate(spot, rBase, rQuote, d, feePercent, tr.direction);
            const notionalValue = tr.notional * calc.forwardRate;
            
            const mc = calcMarginCall(tr.notional, calc.forwardRate, spot, tr.direction, marginPct, marginTrigger);

            return {
                ...tr,
                days: d,
                ...calc,
                notionalValue,
                margin: mc
            };
        });
    }, [tranches, spot, rates, baseCcy, quoteCcy, feePercent, marginPct, marginTrigger, todayStr]);

    // Summary calculations
    const summary = useMemo(() => {
        if (computedTranches.length === 0) return null;
        const totalNotional = computedTranches.reduce((s, t) => s + t.notional, 0);
        const weightedRate = totalNotional > 0
            ? computedTranches.reduce((s, t) => s + t.notional * t.forwardRate, 0) / totalNotional
            : 0;
        const totalValue = computedTranches.reduce((s, t) => s + t.notionalValue, 0);
        const vsSpot = weightedRate - spot;
        const vsSpotPct = (vsSpot / spot) * 100;
        const totalDeposit = computedTranches.reduce((s, t) => s + t.margin.initialDeposit, 0);
        const totalContractValue = computedTranches.reduce((s, t) => s + t.margin.contractValue, 0);

        return { totalNotional, weightedRate, totalValue, vsSpot, vsSpotPct, totalDeposit, totalContractValue };
    }, [computedTranches, spot]);

    // Handlers
    const addTranche = () => {
        const last = tranches[tranches.length - 1];
        const newTr = {
            id: Date.now() + Math.random(),
            startDate: last ? last.endDate : addMonths(todayStr, 1),
            endDate: last ? addMonths(last.endDate, 1) : addMonths(todayStr, 2),
            direction: last ? last.direction : 'buy',
            notional: last ? last.notional : 100000,
        };
        setTranches([...tranches, newTr]);
    };

    const removeTranche = (id) => {
        if (tranches.length <= 1) return;
        setTranches(tranches.filter(t => t.id !== id));
    };

    const updateTranche = (id, field, value) => {
        setTranches(tranches.map(t => t.id === id ? { ...t, [field]: value } : t));
    };

    const saveStrategy = () => {
        if (!saveName.trim()) { showToast(t.nameRequired); return; }
        const strategy = {
            id: Date.now(),
            name: saveName.trim(),
            date: todayStr,
            baseCcy, quoteCcy, spot, feePercent, marginPct, marginTrigger,
            tranches, rates: { [baseCcy]: rates[baseCcy], [quoteCcy]: rates[quoteCcy] }
        };
        setSavedStrategies([strategy, ...savedStrategies]);
        setSaveModalOpen(false);
        setSaveName('');
        showToast(t.saved);
    };

    const loadStrategy = (strategy) => {
        setBaseCcy(strategy.baseCcy);
        setQuoteCcy(strategy.quoteCcy);
        setSpot(strategy.spot);
        setFeePercent(strategy.feePercent);
        setMarginPct(strategy.marginPct);
        setMarginTrigger(strategy.marginTrigger);
        setTranches(strategy.tranches);
        if (strategy.rates) {
            setRates(prev => ({ ...prev, ...strategy.rates }));
        }
        setShowSaved(false);
        showToast(t.loaded);
    };

    const deleteStrategy = (id) => {
        setSavedStrategies(savedStrategies.filter(s => s.id !== id));
        showToast(t.deleted);
    };

    const copyToClipboard = () => {
        if (!summary) return;
        const pair = `${baseCcy}/${quoteCcy}`;
        const lines = [
            `═══ FX Hedging Pro - ${t.strategy} ═══`,
            `${t.currencyPair}: ${pair}`,
            `${t.spotRate}: ${formatRate(spot, pair)}`,
            `${t.feeMarkup}: ${feePercent}%`,
            ``,
            `── ${t.tranches} ──`,
            ...computedTranches.map((tr, i) => 
                `#${i + 1} | ${tr.startDate} → ${tr.endDate} | ${tr.direction === 'buy' ? t.buy : t.sell} | ${formatNumber(tr.notional, 0)} ${baseCcy} | ${t.fwdRate}: ${formatRate(tr.forwardRate, pair)}`
            ),
            ``,
            `── ${t.summary} ──`,
            `${t.totalNotional}: ${formatNumber(summary.totalNotional, 0)} ${baseCcy}`,
            `${t.weightedAvgRate}: ${formatRate(summary.weightedRate, pair)}`,
            `${t.totalValue}: ${formatNumber(summary.totalValue, 0)} ${quoteCcy}`,
            `${t.vsSpot}: ${summary.vsSpot >= 0 ? '+' : ''}${formatRate(summary.vsSpot, pair)} (${summary.vsSpotPct >= 0 ? '+' : ''}${formatNumber(summary.vsSpotPct)}%)`,
        ];
        navigator.clipboard.writeText(lines.join('\n'));
        showToast(t.copied);
    };

    const resetStrategy = () => {
        setTranches([createDefaultTranche(0)]);
        setSpot(1.0850);
        setFeePercent(0.15);
    };

    const pairStr = `${baseCcy}/${quoteCcy}`;
    const rateBase = rates[baseCcy] || 0;
    const rateQuote = rates[quoteCcy] || 0;
    const diffSign = rateQuote > rateBase ? '+' : '';
    const differential = rateQuote - rateBase;

    // Risk color helper
    const riskColor = (level) => {
        const colors = { low: 'text-emerald-600 dark:text-emerald-400', medium: 'text-amber-500', high: 'text-orange-500', critical: 'text-red-600 dark:text-red-400' };
        return colors[level] || colors.low;
    };
    const riskBg = (level) => {
        const colors = { low: 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700', medium: 'bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-700', high: 'bg-orange-50 dark:bg-orange-900/30 border-orange-200 dark:border-orange-700', critical: 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-700' };
        return colors[level] || colors.low;
    };
    const riskLabel = (level) => {
        const labels = { low: t.low, medium: t.medium, high: t.high, critical: t.critical };
        return labels[level] || labels.low;
    };

    // ───── RENDER ─────
    return (
        <div className={`min-h-screen ${dark ? 'bg-night-900 text-slate-200' : 'bg-warm-50 text-slate-800'}`}>
            {toast && <Toast message={toast} onClose={() => setToast(null)} />}

            {/* ═══ HEADER ═══ */}
            <header className={`sticky top-0 z-40 backdrop-blur-xl border-b ${dark ? 'bg-night-800/90 border-slate-700/50' : 'bg-white/90 border-slate-200/60'}`}>
                <div className="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${dark ? 'bg-indigo-600' : 'bg-indigo-500'} shadow-lg shadow-indigo-500/25`}>
                            <span className="text-white font-bold text-sm">FX</span>
                        </div>
                        <div>
                            <h1 className="text-lg font-bold tracking-tight">{t.appTitle}</h1>
                            <p className={`text-xs ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.strategy}</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        {/* Language toggle */}
                        <button onClick={() => setLang(lang === 'fr' ? 'en' : 'fr')}
                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${dark ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                            <Icon name="globe" className="w-3.5 h-3.5" />
                            {lang === 'fr' ? 'EN' : 'FR'}
                        </button>
                        {/* Theme toggle */}
                        <button onClick={() => setDark(!dark)}
                            className={`p-2 rounded-lg transition-all ${dark ? 'bg-slate-700 hover:bg-slate-600 text-amber-400' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                            <Icon name={dark ? 'sun' : 'moon'} className="w-4 h-4" />
                        </button>
                        {/* Saved strategies */}
                        <button onClick={() => setShowSaved(!showSaved)}
                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${dark ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                            <Icon name="folder" className="w-3.5 h-3.5" />
                            <span className="hidden sm:inline">{t.savedStrategies}</span>
                            {savedStrategies.length > 0 && (
                                <span className="bg-indigo-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{savedStrategies.length}</span>
                            )}
                        </button>
                        {/* Save button */}
                        <button onClick={() => setSaveModalOpen(true)}
                            className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500 hover:bg-indigo-600 text-white transition-all shadow-md shadow-indigo-500/25">
                            <Icon name="save" className="w-3.5 h-3.5" />
                            <span className="hidden sm:inline">{t.save}</span>
                        </button>
                    </div>
                </div>
            </header>

            <main className="max-w-[1600px] mx-auto px-4 sm:px-6 py-6 space-y-6">
                {/* ═══ TOP CONTROLS ═══ */}
                <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                    {/* Currency Pair */}
                    <div className={`rounded-2xl p-5 ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                        <label className={`text-xs font-semibold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.currencyPair}</label>
                        <div className="flex items-center gap-2 mt-3">
                            <select value={baseCcy} onChange={e => { if (e.target.value !== quoteCcy) setBaseCcy(e.target.value); }}
                                className={`flex-1 px-3 py-2 rounded-xl text-sm font-semibold appearance-none pr-7 ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none`}>
                                {CURRENCIES.filter(c => c !== quoteCcy).map(c => (
                                    <option key={c} value={c}>{CCY_FLAGS[c]} {c}</option>
                                ))}
                            </select>
                            <div className={`p-1 ${dark ? 'text-slate-500' : 'text-slate-300'}`}>
                                <Icon name="arrowRight" className="w-5 h-5" />
                            </div>
                            <select value={quoteCcy} onChange={e => { if (e.target.value !== baseCcy) setQuoteCcy(e.target.value); }}
                                className={`flex-1 px-3 py-2 rounded-xl text-sm font-semibold appearance-none pr-7 ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none`}>
                                {CURRENCIES.filter(c => c !== baseCcy).map(c => (
                                    <option key={c} value={c}>{CCY_FLAGS[c]} {c}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* Spot Rate */}
                    <div className={`rounded-2xl p-5 ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                        <div className="flex items-center justify-between">
                            <label className={`text-xs font-semibold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.spotToday}</label>
                            <button onClick={() => setIsLive(!isLive)}
                                className={`text-[10px] px-2 py-0.5 rounded-full font-bold transition-all ${isLive ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400' : 'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400'}`}>
                                {isLive ? t.live : t.manual}
                            </button>
                        </div>
                        <div className="mt-3 relative">
                            <input type="number" step="0.0001" value={spot} 
                                onChange={e => {
                                    setSpot(parseFloat(e.target.value) || 0);
                                    setIsLive(false);
                                }}
                                className={`w-full px-3 py-2 rounded-xl font-mono text-xl font-bold ${dark ? 'bg-slate-700 border-slate-600 text-emerald-400' : 'bg-slate-50 border-slate-200 text-emerald-600'} border focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none transition-colors duration-100`} />
                        </div>
                        <p className={`text-[10px] mt-1.5 ${dark ? 'text-slate-500' : 'text-slate-400'}`}>{CCY_FLAGS[baseCcy]} 1 {baseCcy} = {CCY_FLAGS[quoteCcy]} {formatRate(spot, pairStr)} {quoteCcy}</p>
                    </div>

                    {/* Fees */}
                    <div className={`rounded-2xl p-5 ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                        <label className={`text-xs font-semibold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.fees}</label>
                        <div className="mt-3">
                            <div className="relative">
                                <input type="number" step="0.01" value={feePercent} onChange={e => setFeePercent(parseFloat(e.target.value) || 0)}
                                    className={`w-full px-3 py-2 pr-8 rounded-xl font-mono text-lg font-semibold ${dark ? 'bg-slate-700 border-slate-600 text-amber-400' : 'bg-slate-50 border-slate-200 text-amber-600'} border focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none`} />
                                <span className={`absolute right-3 top-1/2 -translate-y-1/2 text-sm font-bold ${dark ? 'text-slate-500' : 'text-slate-400'}`}>%</span>
                            </div>
                        </div>
                        <p className={`text-[10px] mt-1.5 ${dark ? 'text-slate-500' : 'text-slate-400'}`}>{t.feeMarkup} → {formatRate(calcFeePoints(spot, feePercent), pairStr)} pts</p>
                    </div>

                    {/* Interest Rates Preview */}
                    <div className={`rounded-2xl p-5 cursor-pointer card-hover ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}
                        onClick={() => setShowRates(!showRates)}>
                        <div className="flex items-center justify-between">
                            <label className={`text-xs font-semibold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.interestRates}</label>
                            <Icon name={showRates ? 'chevronUp' : 'chevronDown'} className={`w-4 h-4 ${dark ? 'text-slate-500' : 'text-slate-400'}`} />
                        </div>
                        <div className="mt-3 space-y-1.5">
                            <div className="flex items-center justify-between">
                                <span className="text-sm">{CCY_FLAGS[baseCcy]} {baseCcy}</span>
                                <span className={`font-mono text-sm font-bold ${dark ? 'text-sky-400' : 'text-sky-600'}`}>{formatNumber(rateBase)}%</span>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-sm">{CCY_FLAGS[quoteCcy]} {quoteCcy}</span>
                                <span className={`font-mono text-sm font-bold ${dark ? 'text-sky-400' : 'text-sky-600'}`}>{formatNumber(rateQuote)}%</span>
                            </div>
                            <div className={`text-xs font-medium mt-1 ${differential > 0 ? 'text-emerald-500' : differential < 0 ? 'text-red-400' : (dark ? 'text-slate-400' : 'text-slate-500')}`}>
                                Δ {diffSign}{formatNumber(differential)}% → {differential > 0 ? t.premium : t.discount}
                            </div>
                        </div>
                    </div>
                </div>

                {/* ═══ INTEREST RATES EDITOR (Collapsible) ═══ */}
                {showRates && (
                    <div className={`rounded-2xl p-5 fade-in ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-sm font-bold">{t.editRates}</h3>
                            <button onClick={() => { setRates({ ...DEFAULT_RATES }); showToast(t.resetRates); }}
                                className={`flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-medium ${dark ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                                <Icon name="refresh" className="w-3 h-3" />
                                {t.reset}
                            </button>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                            {CURRENCIES.map(ccy => (
                                <div key={ccy} className={`flex items-center gap-2 p-2 rounded-xl ${dark ? 'bg-slate-700/50' : 'bg-slate-50'}`}>
                                    <span className="text-sm">{CCY_FLAGS[ccy]}</span>
                                    <span className={`text-xs font-semibold w-8 ${ccy === baseCcy || ccy === quoteCcy ? (dark ? 'text-indigo-400' : 'text-indigo-600') : ''}`}>{ccy}</span>
                                    <input type="number" step="0.05" value={rates[ccy]}
                                        onChange={e => setRates({ ...rates, [ccy]: parseFloat(e.target.value) || 0 })}
                                        className={`flex-1 w-full px-2 py-1 rounded-lg text-xs font-mono font-bold text-right ${dark ? 'bg-slate-800 border-slate-600 text-slate-200' : 'bg-white border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                    <span className={`text-[10px] ${dark ? 'text-slate-500' : 'text-slate-400'}`}>%</span>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* ═══ TRANCHES TABLE ═══ */}
                <div className={`rounded-2xl overflow-hidden ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                    <div className="p-5 flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/50">
                        <div>
                            <h2 className="text-base font-bold">{t.tranches}</h2>
                            <p className={`text-xs mt-0.5 ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{CCY_FLAGS[baseCcy]} {baseCcy} → {CCY_FLAGS[quoteCcy]} {quoteCcy} • {t.spotRate}: {formatRate(spot, pairStr)}</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={copyToClipboard}
                                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${dark ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                                <Icon name="copy" className="w-3.5 h-3.5" />
                                {t.copyStrategy}
                            </button>
                            <button onClick={addTranche}
                                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500 hover:bg-indigo-600 text-white transition-all shadow-md shadow-indigo-500/25">
                                <Icon name="plus" className="w-3.5 h-3.5" />
                                {t.addTranche}
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead>
                                <tr className={dark ? 'bg-slate-800/50' : 'bg-slate-50/80'}>
                                    <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">#</th>
                                    <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.startDate}</th>
                                    <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.endDate}</th>
                                    <th className="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.direction}</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.notional} ({baseCcy})</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.days}</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.fwdPoints}</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.feePts}</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.fwdRate}</th>
                                    <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.value} ({quoteCcy})</th>
                                    <th className="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400"></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50">
                                {computedTranches.map((tr, i) => (
                                    <tr key={tr.id} className={`${dark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50/50'} transition-colors`}>
                                        <td className="px-4 py-3">
                                            <span className={`inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-bold ${dark ? 'bg-indigo-900/40 text-indigo-400' : 'bg-indigo-50 text-indigo-600'}`}>
                                                {i + 1}
                                            </span>
                                        </td>
                                        <td className="px-4 py-3">
                                            <input type="date" value={tr.startDate}
                                                onChange={e => updateTranche(tr.id, 'startDate', e.target.value)}
                                                className={`px-2 py-1 rounded-lg text-xs font-mono ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-700'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                        </td>
                                        <td className="px-4 py-3">
                                            <input type="date" value={tr.endDate}
                                                onChange={e => updateTranche(tr.id, 'endDate', e.target.value)}
                                                className={`px-2 py-1 rounded-lg text-xs font-mono ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-700'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                        </td>
                                        <td className="px-4 py-3 text-center">
                                            <select value={tr.direction} onChange={e => updateTranche(tr.id, 'direction', e.target.value)}
                                                className={`px-2 py-1 rounded-lg text-xs font-semibold appearance-none pr-6 ${
                                                    tr.direction === 'buy'
                                                        ? (dark ? 'bg-emerald-900/40 border-emerald-700 text-emerald-400' : 'bg-emerald-50 border-emerald-200 text-emerald-700')
                                                        : (dark ? 'bg-red-900/40 border-red-700 text-red-400' : 'bg-red-50 border-red-200 text-red-700')
                                                } border focus:ring-2 focus:ring-indigo-500/30 outline-none`}>
                                                <option value="buy">{t.buy}</option>
                                                <option value="sell">{t.sell}</option>
                                            </select>
                                        </td>
                                        <td className="px-4 py-3 text-right">
                                            <input type="number" step="1000" value={tr.notional}
                                                onChange={e => updateTranche(tr.id, 'notional', parseFloat(e.target.value) || 0)}
                                                className={`w-28 px-2 py-1 rounded-lg text-xs font-mono font-bold text-right ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                        </td>
                                        <td className={`px-4 py-3 text-right font-mono text-xs ${dark ? 'text-slate-400' : 'text-slate-500'}`}>
                                            {tr.days}
                                        </td>
                                        <td className={`px-4 py-3 text-right font-mono text-xs font-semibold ${tr.forwardPoints >= 0 ? 'text-emerald-500' : 'text-red-400'}`}>
                                            {tr.forwardPoints >= 0 ? '+' : ''}{formatRate(tr.forwardPoints, pairStr)}
                                        </td>
                                        <td className={`px-4 py-3 text-right font-mono text-xs ${dark ? 'text-amber-400' : 'text-amber-600'}`}>
                                            {tr.direction === 'buy' ? '+' : '-'}{formatRate(tr.feePoints, pairStr)}
                                        </td>
                                        <td className={`px-4 py-3 text-right font-mono text-sm font-bold ${dark ? 'text-slate-100' : 'text-slate-900'}`}>
                                            {formatRate(tr.forwardRate, pairStr)}
                                        </td>
                                        <td className={`px-4 py-3 text-right font-mono text-xs ${dark ? 'text-slate-300' : 'text-slate-700'}`}>
                                            {formatNumber(tr.notionalValue, 0)}
                                        </td>
                                        <td className="px-4 py-3 text-center">
                                            {tranches.length > 1 && (
                                                <button onClick={() => removeTranche(tr.id)}
                                                    className={`p-1.5 rounded-lg transition-all ${dark ? 'hover:bg-red-900/40 text-slate-500 hover:text-red-400' : 'hover:bg-red-50 text-slate-400 hover:text-red-500'}`}>
                                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Summary row */}
                    {summary && (
                        <div className={`px-5 py-4 border-t ${dark ? 'bg-slate-800/30 border-slate-700/50' : 'bg-indigo-50/30 border-slate-200/60'}`}>
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                <div>
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.totalNotional}</p>
                                    <p className="font-mono text-base font-bold mt-0.5">{formatNumber(summary.totalNotional, 0)} <span className={`text-xs ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{baseCcy}</span></p>
                                </div>
                                <div>
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.weightedAvgRate}</p>
                                    <p className={`font-mono text-base font-bold mt-0.5 ${dark ? 'text-indigo-400' : 'text-indigo-600'}`}>{formatRate(summary.weightedRate, pairStr)}</p>
                                </div>
                                <div>
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.totalValue}</p>
                                    <p className="font-mono text-base font-bold mt-0.5">{formatNumber(summary.totalValue, 0)} <span className={`text-xs ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{quoteCcy}</span></p>
                                </div>
                                <div>
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.vsSpot}</p>
                                    <p className={`font-mono text-base font-bold mt-0.5 ${summary.vsSpot >= 0 ? 'text-emerald-500' : 'text-red-400'}`}>
                                        {summary.vsSpot >= 0 ? '+' : ''}{formatRate(summary.vsSpot, pairStr)}
                                        <span className="text-xs ml-1">({summary.vsSpotPct >= 0 ? '+' : ''}{formatNumber(summary.vsSpotPct)}%)</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                {/* ═══ MARGIN CALL SECTION ═══ */}
                <div className={`rounded-2xl overflow-hidden ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                    <div className="p-5 border-b border-slate-200/60 dark:border-slate-700/50">
                        <div className="flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${dark ? 'bg-amber-900/40' : 'bg-amber-50'}`}>
                                <Icon name="alertTriangle" className={`w-4 h-4 ${dark ? 'text-amber-400' : 'text-amber-600'}`} />
                            </div>
                            <div>
                                <h2 className="text-base font-bold">{t.marginCalculator}</h2>
                                <p className={`text-xs mt-0.5 ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.marginCall}</p>
                            </div>
                        </div>
                    </div>

                    <div className="p-5 space-y-5">
                        {/* Margin parameters */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label className={`text-xs font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.marginDeposit}</label>
                                <div className="relative mt-1">
                                    <input type="number" step="0.5" value={marginPct} onChange={e => setMarginPct(parseFloat(e.target.value) || 0)}
                                        className={`w-full px-3 py-2 pr-8 rounded-xl font-mono text-sm font-semibold ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                    <span className={`absolute right-3 top-1/2 -translate-y-1/2 text-sm ${dark ? 'text-slate-500' : 'text-slate-400'}`}>%</span>
                                </div>
                            </div>
                            <div>
                                <label className={`text-xs font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.marginTrigger}</label>
                                <div className="relative mt-1">
                                    <input type="number" step="5" value={marginTrigger} onChange={e => setMarginTrigger(parseFloat(e.target.value) || 0)}
                                        className={`w-full px-3 py-2 pr-8 rounded-xl font-mono text-sm font-semibold ${dark ? 'bg-slate-700 border-slate-600 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'} border focus:ring-2 focus:ring-indigo-500/30 outline-none`} />
                                    <span className={`absolute right-3 top-1/2 -translate-y-1/2 text-sm ${dark ? 'text-slate-500' : 'text-slate-400'}`}>%</span>
                                </div>
                            </div>
                        </div>

                        {/* Per-tranche margin table */}
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className={dark ? 'bg-slate-800/50' : 'bg-slate-50/80'}>
                                        <th className="px-4 py-2 text-left text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.tranche}</th>
                                        <th className="px-4 py-2 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.contractValue}</th>
                                        <th className="px-4 py-2 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.initialDeposit}</th>
                                        <th className="px-4 py-2 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.firstMC}</th>
                                        <th className="px-4 py-2 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.secondMC}</th>
                                        <th className="px-4 py-2 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.thirdMC}</th>
                                        <th className="px-4 py-2 text-center text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{t.riskLevel}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50">
                                    {computedTranches.map((tr, i) => (
                                        <tr key={tr.id} className={`${dark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50/50'} transition-colors`}>
                                            <td className="px-4 py-3">
                                                <span className={`inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-bold ${dark ? 'bg-indigo-900/40 text-indigo-400' : 'bg-indigo-50 text-indigo-600'}`}>{i + 1}</span>
                                            </td>
                                            <td className="px-4 py-3 text-right font-mono text-xs">{formatNumber(tr.margin.contractValue, 0)} {quoteCcy}</td>
                                            <td className="px-4 py-3 text-right font-mono text-xs font-semibold">{formatNumber(tr.margin.initialDeposit, 0)} {quoteCcy}</td>
                                            <td className={`px-4 py-3 text-right font-mono text-xs font-bold ${dark ? 'text-amber-400' : 'text-amber-600'}`}>{formatRate(tr.margin.mc1Spot, pairStr)}</td>
                                            <td className={`px-4 py-3 text-right font-mono text-xs font-bold ${dark ? 'text-orange-400' : 'text-orange-600'}`}>{formatRate(tr.margin.mc2Spot, pairStr)}</td>
                                            <td className={`px-4 py-3 text-right font-mono text-xs font-bold ${dark ? 'text-red-400' : 'text-red-600'}`}>{formatRate(tr.margin.mc3Spot, pairStr)}</td>
                                            <td className="px-4 py-3 text-center">
                                                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border ${riskBg(tr.margin.riskLevel)}`}>
                                                    <span className={`w-1.5 h-1.5 rounded-full ${
                                                        tr.margin.riskLevel === 'low' ? 'bg-emerald-500' :
                                                        tr.margin.riskLevel === 'medium' ? 'bg-amber-500' :
                                                        tr.margin.riskLevel === 'high' ? 'bg-orange-500' : 'bg-red-500'
                                                    }`} />
                                                    <span className={riskColor(tr.margin.riskLevel)}>{riskLabel(tr.margin.riskLevel)}</span>
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Total margin summary */}
                        {summary && (
                            <div className={`grid grid-cols-1 sm:grid-cols-3 gap-4 p-4 rounded-xl ${dark ? 'bg-slate-800/50' : 'bg-amber-50/50'}`}>
                                <div className="text-center">
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.contractValue}</p>
                                    <p className="font-mono text-sm font-bold mt-1">{formatNumber(summary.totalContractValue, 0)} {quoteCcy}</p>
                                </div>
                                <div className="text-center">
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.initialDeposit}</p>
                                    <p className={`font-mono text-sm font-bold mt-1 ${dark ? 'text-amber-400' : 'text-amber-600'}`}>{formatNumber(summary.totalDeposit, 0)} {quoteCcy}</p>
                                </div>
                                <div className="text-center">
                                    <p className={`text-[10px] uppercase tracking-wider font-semibold ${dark ? 'text-slate-400' : 'text-slate-500'}`}>{t.marginDeposit}</p>
                                    <p className="font-mono text-sm font-bold mt-1">{marginPct}%</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>

                {/* ═══ SAVED STRATEGIES PANEL ═══ */}
                {showSaved && (
                    <div className={`rounded-2xl overflow-hidden fade-in ${dark ? 'bg-night-800 border border-slate-700/50' : 'bg-white border border-slate-200/60'} shadow-sm`}>
                        <div className="p-5 border-b border-slate-200/60 dark:border-slate-700/50 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <Icon name="folder" className={`w-5 h-5 ${dark ? 'text-indigo-400' : 'text-indigo-500'}`} />
                                <h2 className="text-base font-bold">{t.savedStrategies}</h2>
                            </div>
                            <button onClick={() => setShowSaved(false)} className={`p-1.5 rounded-lg ${dark ? 'hover:bg-slate-700' : 'hover:bg-slate-100'}`}>
                                <Icon name="x" className="w-4 h-4 text-slate-400" />
                            </button>
                        </div>
                        {savedStrategies.length === 0 ? (
                            <div className="p-10 text-center">
                                <Icon name="folder" className={`w-10 h-10 mx-auto mb-3 ${dark ? 'text-slate-600' : 'text-slate-300'}`} />
                                <p className={`text-sm ${dark ? 'text-slate-500' : 'text-slate-400'}`}>{t.noSaved}</p>
                            </div>
                        ) : (
                            <div className="divide-y divide-slate-100 dark:divide-slate-700/50">
                                {savedStrategies.map(s => (
                                    <div key={s.id} className={`px-5 py-3 flex items-center justify-between ${dark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50/50'} transition-colors`}>
                                        <div className="flex items-center gap-4">
                                            <div>
                                                <p className="text-sm font-semibold">{s.name}</p>
                                                <p className={`text-xs ${dark ? 'text-slate-400' : 'text-slate-500'}`}>
                                                    {s.date} • {CCY_FLAGS[s.baseCcy]} {s.baseCcy}/{CCY_FLAGS[s.quoteCcy]} {s.quoteCcy} • {s.tranches.length} {t.tranches.toLowerCase()}
                                                </p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => loadStrategy(s)}
                                                className={`px-3 py-1 rounded-lg text-xs font-semibold ${dark ? 'bg-indigo-900/40 hover:bg-indigo-900/60 text-indigo-400' : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-600'} transition-all`}>
                                                {t.load}
                                            </button>
                                            <button onClick={() => deleteStrategy(s.id)}
                                                className={`px-3 py-1 rounded-lg text-xs font-semibold ${dark ? 'bg-red-900/40 hover:bg-red-900/60 text-red-400' : 'bg-red-50 hover:bg-red-100 text-red-600'} transition-all`}>
                                                {t.delete}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}

                {/* Footer */}
                <footer className={`text-center py-6 text-xs ${dark ? 'text-slate-600' : 'text-slate-400'}`}>
                    FX Hedging Pro • {t.parity} • {new Date().getFullYear()}
                </footer>
            </main>

            {/* ═══ SAVE MODAL ═══ */}
            <Modal open={saveModalOpen} onClose={() => setSaveModalOpen(false)} title={t.save + ' — ' + t.strategyName}>
                <div className="space-y-4">
                    <input type="text" placeholder={t.enterName} value={saveName} onChange={e => setSaveName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && saveStrategy()}
                        autoFocus
                        className={`w-full px-4 py-3 rounded-xl text-sm font-medium ${dark ? 'bg-slate-700 border-slate-600 text-slate-200 placeholder-slate-500' : 'bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400'} border focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none`} />
                    <div className={`p-3 rounded-xl text-xs ${dark ? 'bg-slate-700/50 text-slate-400' : 'bg-slate-50 text-slate-500'}`}>
                        {CCY_FLAGS[baseCcy]} {baseCcy}/{CCY_FLAGS[quoteCcy]} {quoteCcy} • {t.spotRate}: {formatRate(spot, pairStr)} • {computedTranches.length} {t.tranches.toLowerCase()}
                    </div>
                    <div className="flex gap-3 justify-end">
                        <button onClick={() => setSaveModalOpen(false)}
                            className={`px-4 py-2 rounded-xl text-sm font-semibold ${dark ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'} transition-all`}>
                            {t.cancel}
                        </button>
                        <button onClick={saveStrategy}
                            className="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-500 hover:bg-indigo-600 text-white transition-all shadow-md shadow-indigo-500/25">
                            {t.confirm}
                        </button>
                    </div>
                </div>
            </Modal>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
